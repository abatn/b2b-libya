<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{suppliers.title}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f5f7fa; color: #333; }
        :root { --primary: #ff6a00; --secondary: #1a1a2e; --accent: #00d2ff; --success: #28a745; --border: #e8e8e8; --radius: 12px; }
        .navbar { background: var(--secondary); padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .navbar-brand { color: var(--primary); font-size: 1.4rem; font-weight: bold; text-decoration: none; }
        .nav-links { display: flex; gap: 4px; align-items: center; }
        .nav-links a { color: #8892b0; text-decoration: none; padding: 8px 14px; border-radius: 5px; transition: 0.3s; font-size: 0.9rem; }
        .nav-links a:hover, .nav-links a.active { background: var(--primary); color: white; }
        .lang-switch { position: fixed; top: 15px; right: 15px; z-index: 1000; display: flex; border-radius: 25px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .lang-btn { padding: 8px 16px; border: none; cursor: pointer; font-weight: bold; text-decoration: none; }
        .lang-btn.active { background: var(--primary); color: white; }
        .lang-btn:not(.active) { background: rgba(26,26,46,0.8); color: white; }
        [dir="rtl"] .navbar { flex-direction: row-reverse; }
        [dir="rtl"] .lang-btn { margin-inline-start: auto; margin-inline-end: 0; }

        .container { max-width: 1200px; margin: 0 auto; padding: 30px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .page-header h2 { font-size: 1.5rem; color: var(--secondary); }
        .sort-bar { display: flex; gap: 8px; }
        .sort-btn { padding: 8px 16px; border: 2px solid var(--border); border-radius: 20px; background: white; cursor: pointer; font-size: 0.85rem; transition: 0.2s; }
        .sort-btn:hover, .sort-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .suppliers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }
        .supplier-card { background: white; border-radius: var(--radius); padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: 0.3s; cursor: pointer; text-decoration: none; color: inherit; display: block; }
        .supplier-card:hover { transform: translateY(-4px); box-shadow: 0 6px 20px rgba(0,0,0,0.12); }
        .supplier-header { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .supplier-logo { width: 60px; height: 60px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; flex-shrink: 0; }
        .supplier-info h3 { font-size: 1.1rem; color: var(--secondary); margin-bottom: 2px; }
        .supplier-info .location { font-size: 0.8rem; color: #888; }
        .badges { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
        .badge { padding: 4px 10px; border-radius: 12px; font-size: 0.7rem; font-weight: 600; }
        .badge-verified { background: #e6f9ee; color: var(--success); }
        .badge-trade { background: #fff3e0; color: #e67e22; }
        .badge-years { background: #e8f4fd; color: var(--accent); }
        .rating { display: flex; align-items: center; gap: 6px; margin: 10px 0; }
        .stars { color: #ffc107; font-size: 1rem; }
        .rating-text { font-size: 0.85rem; color: #888; }
        .supplier-stats { display: flex; justify-content: space-between; padding-top: 12px; border-top: 1px solid var(--border); }
        .stat { text-align: center; }
        .stat-value { font-size: 1.1rem; font-weight: bold; color: var(--primary); }
        .stat-label { font-size: 0.75rem; color: #888; }
        .btn-message { width: 100%; margin-top: 12px; padding: 10px; background: white; color: var(--primary); border: 2px solid var(--primary); border-radius: 8px; font-weight: 600; cursor: pointer; }
        .btn-message:hover { background: #fff5f0; }

        .no-suppliers { text-align: center; padding: 60px; color: #888; }
        footer { background: var(--secondary); color: #8892b0; padding: 30px; text-align: center; margin-top: 40px; }
        footer a { color: var(--primary); text-decoration: none; }

        @media (max-width: 640px) {
            .suppliers-grid { grid-template-columns: 1fr; }
            .navbar { padding: 10px 15px; }
            .nav-links a { padding: 6px 10px; font-size: 0.8rem; }
            .page-header { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>
    <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
      <symbol id="icon-star" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></symbol>
      <symbol id="icon-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></symbol>
      <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></symbol>
    </svg>
    <div class="lang-switch"><a href="/b2b/suppliers" class="lang-btn active">EN</a></div>
    <nav class="navbar">
        <a href="/" class="navbar-brand">Libya B2B</a>
        <div class="nav-links">
            <a href="/">{{nav.home}}</a>
            <a href="/products">{{nav.products}}</a>
            <a href="/b2b/products">{{nav.b2b}}</a>
            <a href="/b2b/suppliers" class="active">{{suppliers.title}}</a>
            <a href="/b2b/rfq">{{rfq.title}}</a>
            <a href="/b2b/messages">{{messages.title}}</a>
            <a href="/seller">{{nav.seller}}</a>
            <a href="/buyer">{{nav.buyer}}</a>
        </div>
        <a href="/ar/b2b/suppliers" class="lang-btn" data-lang-switch>{{nav.switch_lang}}</a>
    </nav>

    <div class="container">
        <div class="page-header">
            <h2>{{suppliers.title}}</h2>
            <div class="sort-bar">
                <button class="sort-btn active" onclick="sortSuppliers('rating', this)">{{suppliers.sort_rating}}</button>
                <button class="sort-btn" onclick="sortSuppliers('products', this)">{{suppliers.sort_products}}</button>
                <button class="sort-btn" onclick="sortSuppliers('name', this)">{{suppliers.sort_name}}</button>
            </div>
        </div>
        <div class="suppliers-grid" id="suppliersGrid"></div>
        <div class="no-suppliers" id="noSuppliers" style="display:none;">
            <p>  {{suppliers.no_suppliers}}</p>
        </div>
    </div>

    <footer>
        <p>Libya B2B Platform | {{landing.footer_built}}</p>
    </footer>

    <script>
        const logoColors = ['#667eea','#764ba2','#f093fb','#f5576c','#4facfe','#43e97b','#fa709a'];

        function renderStars(rating) {
            const full = Math.floor(rating);
            const half = rating % 1 >= 0.5 ? 1 : 0;
            let s = '';
            for (let i = 0; i < full; i++) s += '★';
            if (half) s += '½';
            for (let i = full + half; i < 5; i++) s += '☆';
            return s;
        }

        async function loadSuppliers(sort = 'rating') {
            try {
                const res = await fetch(`/api/b2b/suppliers?sort_by=${sort}`);
                const data = await res.json();
                const grid = document.getElementById('suppliersGrid');
                const noSuppliers = document.getElementById('noSuppliers');

                if (!data.suppliers.length) {
                    // Show demo suppliers if none exist
                    const demo = [
                        { id: 1, name: 'Libya Building Materials Co.', name_arabic: 'شركة مواد البناء ليبيا', location: 'Tripoli', rating: 4.8, rating_count: 124, is_verified: true, years_on_platform: 5, product_count: 48 },
                        { id: 2, name: 'Al-Fateh Electrical Supply', name_arabic: 'ال fateh لتوريدات الكهرباء', location: 'Benghazi', rating: 4.6, rating_count: 89, is_verified: true, years_on_platform: 3, product_count: 35 },
                        { id: 3, name: 'Tripoli Hardware Trading', name_arabic: 'تجارةHardware طرابلس', location: 'Tripoli', rating: 4.4, rating_count: 67, is_verified: false, years_on_platform: 2, product_count: 22 },
                        { id: 4, name: 'Mediterranean Textiles', name_arabic: 'منسوجات المتوسط', location: 'Misrata', rating: 4.7, rating_count: 156, is_verified: true, years_on_platform: 7, product_count: 62 },
                        { id: 5, name: 'Green Libya Agriculture', name_arabic: 'زراعة ليبيا الخضراء', location: 'Sabratha', rating: 4.3, rating_count: 45, is_verified: false, years_on_platform: 1, product_count: 15 },
                        { id: 6, name: 'SafePack Packaging Solutions', name_arabic: 'حلول التغليفSafePack', location: 'Zliten', rating: 4.5, rating_count: 78, is_verified: true, years_on_platform: 4, product_count: 30 }
                    ];
                    renderSuppliers(demo);
                    return;
                }
                renderSuppliers(data.suppliers);
            } catch (e) { console.error(e); }
        }

        function renderSuppliers(suppliers) {
            const grid = document.getElementById('suppliersGrid');
            const noSuppliers = document.getElementById('noSuppliers');
            if (!suppliers.length) { grid.innerHTML = ''; noSuppliers.style.display = 'block'; return; }
            noSuppliers.style.display = 'none';
            grid.innerHTML = suppliers.map((s, i) => `
                <a href="/b2b/suppliers/${s.id}" class="supplier-card">
                    <div class="supplier-header">
                        <div class="supplier-logo" style="background:${logoColors[i % logoColors.length]}">${s.name.charAt(0)}</div>
                        <div class="supplier-info">
                            <h3>${s.name}</h3>
                            <div class="location">  ${s.location || 'Libya'}</div>
                        </div>
                    </div>
                    <div class="badges">
                        ${s.is_verified ? '<span class="badge badge-verified">✓ {{suppliers.verified_badge}}</span>' : ''}
                        <span class="badge badge-trade">  {{suppliers.trade_assurance}}</span>
                        <span class="badge badge-years">  {{s.years_on_platform}} {{suppliers.years_badge}}</span>
                    </div>
                    <div class="rating">
                        <span class="stars">${renderStars(s.rating)}</span>
                        <span class="rating-text">${s.rating.toFixed(1)} (${s.rating_count} {{suppliers.reviews_label}})</span>
                    </div>
                    <div class="supplier-stats">
                        <div class="stat"><div class="stat-value">${s.product_count}</div><div class="stat-label">{{suppliers.products_label}}</div></div>
                        <div class="stat"><div class="stat-value">${s.rating.toFixed(1)}</div><div class="stat-label">{{suppliers.sort_rating}}</div></div>
                        <div class="stat"><div class="stat-value">${s.years_on_platform}y</div><div class="stat-label">{{suppliers.years_badge}}</div></div>
                    </div>
                    <button class="btn-message" onclick="event.preventDefault(); alert('Message feature coming soon!')">{{suppliers.contact_supplier}}</button>
                </a>
            `).join('');
        }

        function sortSuppliers(sort, btn) {
            document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadSuppliers(sort);
        }

        loadSuppliers();
    </script>
</body>
</html>
