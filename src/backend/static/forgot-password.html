<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{auth.forgot_password_title}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f5f7fa; color: #333; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { background: white; border-radius: 12px; padding: 40px; max-width: 400px; width: 90%; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h2 { text-align: center; margin-bottom: 10px; color: #1a1a2e; }
        .subtitle { text-align: center; color: #888; margin-bottom: 25px; font-size: 0.9rem; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: #555; }
        .form-group input { width: 100%; padding: 12px; border: 2px solid #e8e8e8; border-radius: 8px; font-size: 0.95rem; }
        .form-group input:focus { border-color: #ff6a00; outline: none; }
        .btn { width: 100%; padding: 12px; background: #ff6a00; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #e55d00; }
        .back-link { text-align: center; margin-top: 20px; }
        .back-link a { color: #ff6a00; text-decoration: none; }
        .back-link a:hover { text-decoration: underline; }
        .success { display: none; background: #e6f9ee; color: #28a745; padding: 15px; border-radius: 8px; margin-bottom: 15px; text-align: center; }
        .error { display: none; background: #fde8e8; color: #dc3545; padding: 15px; border-radius: 8px; margin-bottom: 15px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h2>{{auth.forgot_password_title}}</h2>
        <p class="subtitle">{{auth.forgot_password_subtitle}}</p>
        
        <div class="success" id="success-msg">{{auth.forgot_password_success}}</div>
        <div class="error" id="error-msg"></div>
        
        <form id="forgot-form">
            <div class="form-group">
                <label>{{auth.email}}</label>
                <input type="email" id="email" required placeholder="{{auth.email_placeholder}}">
            </div>
            <button type="submit" class="btn">{{auth.send_reset_link}}</button>
        </form>
        
        <div class="back-link">
            <a href="/">{{auth.back_to_login}}</a>
        </div>
    </div>
    
    <script>
        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const successMsg = document.getElementById('success-msg');
            const errorMsg = document.getElementById('error-msg');
            
            try {
                const res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email }),
                });
                
                if (res.ok) {
                    successMsg.style.display = 'block';
                    errorMsg.style.display = 'none';
                    document.getElementById('forgot-form').style.display = 'none';
                } else {
                    const data = await res.json();
                    errorMsg.textContent = data.detail || 'Error sending reset link';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = 'Network error. Please try again.';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
