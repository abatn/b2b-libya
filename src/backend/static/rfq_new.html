<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{rfq_new.title}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f5f7fa; color: #333; }
        :root { --primary: #ff6a00; --secondary: #1a1a2e; --accent: #00d2ff; --success: #28a745; --border: #e8e8e8; --radius: 12px; }
        .navbar { background: var(--secondary); padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .navbar-brand { color: var(--primary); font-size: 1.4rem; font-weight: bold; text-decoration: none; }
        .nav-links { display: flex; gap: 4px; align-items: center; }
        .nav-links a { color: #8892b0; text-decoration: none; padding: 8px 14px; border-radius: 5px; transition: 0.3s; font-size: 0.9rem; }
        .nav-links a:hover, .nav-links a.active { background: var(--primary); color: white; }
        .lang-switch { position: fixed; top: 15px; right: 15px; z-index: 1000; display: flex; border-radius: 25px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .lang-btn { padding: 8px 16px; border: none; cursor: pointer; font-weight: bold; text-decoration: none; }
        .lang-btn.active { background: var(--primary); color: white; }
        .lang-btn:not(.active) { background: rgba(26,26,46,0.8); color: white; }
        [dir="rtl"] .navbar { flex-direction: row-reverse; }
        [dir="rtl"] .lang-btn { margin-inline-start: auto; margin-inline-end: 0; }

        .container { max-width: 700px; margin: 0 auto; padding: 30px; }
        .form-card { background: white; border-radius: var(--radius); padding: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .form-card h2 { margin-bottom: 25px; color: var(--secondary); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 6px; color: #555; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 8px; font-size: 1rem; font-family: inherit; }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--primary); outline: none; }
        .form-group textarea { min-height: 100px; resize: vertical; }
        .btn-submit { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        .btn-submit:hover { background: #e55d00; }
        .btn-back { display: inline-block; margin-top: 15px; color: var(--primary); text-decoration: none; font-weight: 600; }
        .success-msg { display: none; text-align: center; padding: 40px; color: var(--success); }
        .success-msg .icon { font-size: 3rem; margin-bottom: 15px; }
        footer { background: var(--secondary); color: #8892b0; padding: 30px; text-align: center; margin-top: 40px; }
    </style>
</head>
<body>
    <div class="lang-switch"><a href="/b2b/rfq/new" class="lang-btn active">EN</a></div>
    <nav class="navbar">
        <a href="/" class="navbar-brand">Libya B2B</a>
        <div class="nav-links">
            <a href="/">{{nav.home}}</a>
            <a href="/products">{{nav.products}}</a>
            <a href="/b2b/products">{{nav.b2b}}</a>
            <a href="/b2b/suppliers">{{suppliers.title}}</a>
            <a href="/b2b/rfq" class="active">{{rfq.title}}</a>
            <a href="/b2b/messages">{{messages.title}}</a>
        </div>
        <a href="/ar/b2b/rfq/new" class="lang-btn" data-lang-switch>{{nav.switch_lang}}</a>
    </nav>

    <div class="container">
        <div class="form-card" id="formCard">
            <h2>{{rfq_new.title}}</h2>
            <form id="rfqForm">
                <div class="form-group">
                    <label>{{rfq_new.product_name}}</label>
                    <input type="text" id="productName" required placeholder="e.g., Cement, Steel Bars...">
                </div>
                <div class="form-group">
                    <label>{{rfq_new.quantity}}</label>
                    <input type="number" id="quantity" min="1" required placeholder="e.g., 500">
                </div>
                <div class="form-group">
                    <label>{{rfq_new.delivery_address}}</label>
                    <input type="text" id="deliveryAddress" placeholder="e.g., Tripoli, Gergaresch">
                </div>
                <div class="form-group">
                    <label>{{rfq_new.message}}</label>
                    <textarea id="message" placeholder="Additional details, specifications, delivery requirements..."></textarea>
                </div>
                <button type="submit" class="btn-submit">{{rfq_new.send_to_suppliers}}</button>
            </form>
            <a href="/b2b/rfq" class="btn-back">← {{rfq_new.back_to_list}}</a>
        </div>
        <div class="success-msg" id="successMsg">
            <div class="icon">✅</div>
            <h2>{{rfq_new.success}}</h2>
            <a href="/b2b/rfq" class="btn-back">{{rfq_new.back_to_list}}</a>
        </div>
    </div>

    <footer>
        <p>Libya B2B Platform | {{landing.footer_built}}</p>
    </footer>

    <script>
        document.getElementById('rfqForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await fetch('/api/b2b/rfq', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        product_name: document.getElementById('productName').value,
                        quantity: parseInt(document.getElementById('quantity').value),
                        delivery_address: document.getElementById('deliveryAddress').value,
                        message: document.getElementById('message').value,
                        buyer_id: 1
                    })
                });
                document.getElementById('formCard').style.display = 'none';
                document.getElementById('successMsg').style.display = 'block';
            } catch (e) { alert('Error creating RFQ'); }
        });
    </script>
</body>
</html>
