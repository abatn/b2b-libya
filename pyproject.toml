[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "libya-b2b-platform"
version = "6.0.0"
description = "Offline-first KI-B2B-Plattform fuer Libyen"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"

authors = [
    {name = "Libya B2B Platform Team"}
]

keywords = ["b2b", "libya", "offline-first", "ki", "qr-code"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.0",
    "sqlalchemy==2.0.35",
    "pydantic==2.9.0",
    "scikit-learn==1.5.2",
    "numpy==1.26.4",
    "qrcode[pil]==7.4.2",
    "Pillow==11.3.0",
    "python-multipart==0.0.9",
    "pywebpush==2.0.3",
    "py-vapid==1.9.1",
    "bcrypt==4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "httpx==0.27.2",
    "ruff==0.6.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"main_old.py" = ["E402"]  # backup file, not imported
"src/backend/services/email.py" = ["E501"]  # HTML templates
"src/backend/chatbot.py" = ["E501"]  # Arabic string literals
"src/backend/sync_engine.py" = ["E501"]  # long SQL strings
"src/backend/routes/suppliers.py" = ["E501"]  # long docstrings
"src/backend/seed_data.py" = ["E402"]  # lazy imports after DB setup

[tool.ruff.lint.isort]
known-first-party = ["main", "chatbot", "qr_code", "sync_engine", "config", "models", "routes", "services", "utils"]
