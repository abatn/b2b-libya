# Libya B2B Platform - GitHub Actions CI/CD Pipeline
# v2.0: Lint → Test → Docker → Health Check → Deploy

name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ============================================================
  # STAGE 1: Code Quality
  # ============================================================
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install ruff
      run: pip install ruff
    - name: Lint with ruff
      run: ruff check src/backend/
    - name: Format check
      run: ruff format --check src/backend/

  # ============================================================
  # STAGE 2: Tests
  # ============================================================
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r src/backend/requirements.txt
        pip install pytest httpx
    - name: Run tests
      run: pytest tests/ -v --tb=short
    - name: Test count
      run: |
        RESULT=$(pytest tests/ -q --tb=no 2>&1 | tail -1)
        echo "Test result: $RESULT"

  # ============================================================
  # STAGE 3: Docker Build & Health Check
  # ============================================================
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4

    - name: Build backend image
      run: docker build -t libya-b2b-backend ./src/backend

    - name: Build frontend image
      run: docker build -t libya-b2b-frontend ./src/frontend

    - name: Start services
      run: |
        docker-compose up -d
        sleep 10

    - name: Health check - Backend
      run: |
        curl -sf http://localhost:8000/health || (docker-compose logs backend && exit 1)
        echo "Backend health: OK"

    - name: Health check - Frontend
      run: |
        curl -sf http://localhost:3000/health || (docker-compose logs frontend && exit 1)
        echo "Frontend health: OK"

    - name: API smoke tests
      run: |
        # Products API
        curl -sf http://localhost:8000/api/products > /dev/null
        echo "Products API: OK"
        # B2B Dashboard
        curl -sf http://localhost:8000/api/b2b/dashboard > /dev/null
        echo "B2B Dashboard: OK"
        # Search API
        curl -sf "http://localhost:8000/api/search?q=cement" > /dev/null
        echo "Search API: OK"
        # Reviews API
        curl -sf http://localhost:8000/api/reviews/stats > /dev/null
        echo "Reviews API: OK"
        # Auth API
        curl -sf http://localhost:8000/api/auth/me > /dev/null
        echo "Auth API: OK"

    - name: Monitoring stats
      run: curl -sf http://localhost:8000/api/monitoring/stats | python3 -m json.tool

    - name: Collect logs
      if: failure()
      run: docker-compose logs --tail=50 > docker-logs.txt

    - name: Upload logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: docker-logs
        path: docker-logs.txt

    - name: Stop services
      if: always()
      run: docker-compose down

  # ============================================================
  # STAGE 4: Deploy (only on main push)
  # ============================================================
  deploy:
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
    - uses: actions/checkout@v4
    - name: Deploy to production
      run: |
        echo "Deploy trigger: main branch pushed"
        echo "Add your deploy commands here (ssh, docker push, etc.)"
