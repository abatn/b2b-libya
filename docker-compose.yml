# Libya B2B Platform - Docker Compose
# Backend: Port 8000 (serves HTML + API + static — single process)

services:
  # ============================================================
  # BACKEND (FastAPI) - Port 8000
  # Serves HTML pages (Jinja2), API endpoints, and static assets
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: libya-b2b-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./libya_b2b.db
      - DEBUG=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  libya-b2b-network:
    driver: bridge
