# Libya B2B Platform - Docker Compose Produktion
# Optimierte Images, Ressourcen-Limits, keine Dev-Tools
# Quelle: MENA_B2B_LIBYEN_PHASE1_OPENSOURCE.md

services:
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
      target: production
    container_name: libya-b2b-backend-prod
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/libya_b2b.db
      - DEBUG=false
      - LOG_LEVEL=warning
    volumes:
      - production-data:/app/data
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
      replicas: 1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - libya-b2b-network-prod

volumes:
  production-data:
    driver: local

networks:
  libya-b2b-network-prod:
    driver: bridge
